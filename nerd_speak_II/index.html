<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<style>
	body {
		background-color: #860712;
		color: #FFFFFF;
	}

	.my-btn {
		background-color: #424242; 
		color: white; 
		border: none; 
	}

	.my-btn:hover {
		background-color: #212121; 
		color: white;
	}
</style>
<body>
	<nav class="navbar navbar-inverse">
	  <div class="container-fluid">
		<div class="navbar-header">
		  <a class="navbar-brand" href="#">nerd_speak</a>
		</div>
		<ul class="nav navbar-nav">
		  <li class="active"><a href="index.html">Home</a></li>
		  <li><a href="contact.html">Contact Us</a></li>
		  <li><a href="about.html">About</a></li>
		  <li><a href="syntax-guide.html">Syntax Guide</a></li>
		</ul>
	  </div>
	</nav>
<div class="container-fluid">
	<div class="row">
		<div class="col-lg-12"><div class="form-group">
			<label for="comment">Code:</label>
			<textarea class="form-control" rows="5" id="code-area" placeholder="Type Your Code Here"></textarea>
		</div>
		</div>
	</div>
	<div class="row">
		<div class="col-lg-12"><div class="form-group">
			<button type="button" class="btn my-btn" onclick="runCode()">Run</button> 
			<button type="button" class="btn my-btn" onclick="downloadTextFile()">Download</button>
		</div>
		</div>
	</div>

	<div class="row">
		<div class="col-lg-12"><div class="form-group">
			<label for="comment">Output:</label>
			<textarea class="form-control" rows="5" id="output" placeholder="Output will display here"></textarea>
		</div>
		</div>
	</div>
</div>
<script>
	async function runCode(){
		const codeInput = document.getElementById("code-area");
		const code = codeInput.value;
		var blob = new Blob([code], { type: 'text/plain' });
		
		const url = '/dnd-code';
		const requestOptions = {
			method: 'POST',
			headers: { 'Content-Type': 'text/plain' },
			body: blob
		};

		const response = await fetch(url, requestOptions)
			.then(response => response.json())
			.then(data => {
				console.log(data);
				document.getElementById('output').value = data["result"];
				document.getElementById('output').disabled = true;
			})
			.catch(error => console.error('Error:', error));
	}
	function downloadTextFile(){
		const codeInput = document.getElementById("code-area");
		const code = codeInput.value;
		var blob = new Blob([code], { type: 'text/plain' });
		var link = document.createElement('a');
		link.href = URL.createObjectURL(blob);
		link.download = 'Nerd_Speak.dnd';
		link.click();
	}
</script>
</body>
</html>
